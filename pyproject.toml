[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intel-factory"
version = "0.1.0"
description = "Enterprise document-intelligence factory: synthetic corpus, hybrid extraction, RAG eval, active learning, and feedback OPE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rohith Vairavel" }]
keywords = [
  "document-intelligence",
  "information-extraction",
  "RAG",
  "active-learning",
  "off-policy-evaluation",
  "OCR-simulation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
dashboard = ["streamlit>=1.28", "pandas>=2.0"]

[project.scripts]
doc-intel-factory = "doc_intel_factory.pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/rohithvairavel-ctrl/doc-intel-factory"
Repository = "https://github.com/rohithvairavel-ctrl/doc-intel-factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
